name: chasquiapp

services:
  app:
    # Imagen PHP 8.2 disponible en este servidor, con Composer y pdo_pgsql.
    image: bolipost-app:latest
    user: "1000:1000"
    working_dir: /app
    entrypoint: ["php-fpm", "--nodaemonize", "--fpm-config", "/app/deploy/php-fpm.conf"]
    restart: unless-stopped
    volumes:
      - ./:/app:ro
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "172.65.10.56:8001:80"
    volumes:
      - ./public:/app/public:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
