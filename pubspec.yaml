name: scan_agbc
description: "Aplicacion Flutter ChasquiApp para consulta operativa de paquetes por carteros."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.0
  flutter_local_notifications: ^21.0.0
  flutter_background_service: ^5.1.0
  flutter_secure_storage: ^9.2.2
  google_mlkit_barcode_scanning: ^0.14.2
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.1
  local_auth: ^2.3.0
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  workmanager: ^0.10.9
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/package_box.png
    - assets/images/location_logo.png
    - assets/images/address_not_found_warning.png
